name: Native TUI bundle

on:
  pull_request:
    paths:
      - "crates/**"
      - "Cargo.*"
      - "scripts/stage-tui-binary.mjs"
      - "scripts/verify-tui-bundle.mjs"
      - "src/lib/find-tui-binary.ts"
      - "src/__tests__/native-bundle.test.ts"
      - "src/__tests__/find-tui-binary.test.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/native-tui.yml"
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-native:
    name: Build ${{ matrix.target_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            rust_target: aarch64-apple-darwin
            target_name: tui-darwin-arm64
            binary: diffing-tui
            zig: false
          - os: macos-15-intel
            rust_target: x86_64-apple-darwin
            target_name: tui-darwin-x64
            binary: diffing-tui
            zig: false
          - os: ubuntu-24.04
            rust_target: x86_64-unknown-linux-gnu
            target_name: tui-linux-x64-gnu
            binary: diffing-tui
            zig: false
          - os: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-gnu
            target_name: tui-linux-arm64-gnu
            binary: diffing-tui
            zig: false
          - os: ubuntu-24.04
            rust_target: x86_64-unknown-linux-musl
            target_name: tui-linux-x64-musl
            binary: diffing-tui
            zig: true
          - os: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-musl
            target_name: tui-linux-arm64-musl
            binary: diffing-tui
            zig: true
          - os: windows-2025
            rust_target: x86_64-pc-windows-msvc
            target_name: tui-win32-x64-msvc
            binary: diffing-tui.exe
            zig: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}
      - uses: goto-bus-stop/setup-zig@v2
        if: matrix.zig
      - name: Install cargo-zigbuild
        if: matrix.zig
        run: cargo install cargo-zigbuild --locked
      - name: Build native binary
        if: ${{ !matrix.zig }}
        run: >-
          cargo build --locked --release --target ${{ matrix.rust_target }}
          -p diffing-tui
      - name: Build static musl binary
        if: matrix.zig
        run: >-
          cargo zigbuild --locked --release --target ${{ matrix.rust_target }}
          -p diffing-tui
      - name: Stage native binary
        shell: bash
        run: |
          set -euo pipefail
          binary="target/${{ matrix.rust_target }}/release/${{ matrix.binary }}"
          "$binary" --version
          node scripts/stage-tui-binary.mjs \
            --target "${{ matrix.target_name }}" \
            --binary "$binary" \
            --output-root target/native-binaries
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target_name }}
          path: target/native-binaries/*/*
          if-no-files-found: error
          retention-days: 7

  build-root:
    name: Build bundled npm package
    needs: build-native
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run verify:tui-bundle
      - run: pnpm run build:ts
      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: >-
          test "v$(node -p "require('./package.json').version")"
          = "$GITHUB_REF_NAME"
      - uses: actions/download-artifact@v8
        with:
          pattern: tui-*
          path: dist/native
          merge-multiple: true
      - name: Verify bundled native binaries
        shell: bash
        run: |
          set -euo pipefail
          find dist/native -type f -name 'diffing-tui' -exec chmod 755 {} +
          node scripts/verify-tui-bundle.mjs
          dist/native/tui-linux-x64-gnu/diffing-tui --version
      - name: Pack root package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/root-tarball
          npm pack . --pack-destination target/root-tarball
      - uses: actions/upload-artifact@v7
        with:
          name: diffing-root
          path: target/root-tarball/*.tgz
          if-no-files-found: error
          retention-days: 7

  verify-install:
    name: Verify single-package install
    needs: build-root
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: diffing-root
          path: target/root-tarball
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Inspect release artifact
        shell: bash
        run: |
          set -euo pipefail
          root_archive=$(find target/root-tarball -name '*.tgz' -print -quit)
          test -n "$root_archive"
          unpacked="$RUNNER_TEMP/diffing-package"
          mkdir -p "$unpacked"
          tar -xzf "$root_archive" -C "$unpacked"
          test -f "$unpacked/package/dist/cli.mjs"
          node scripts/verify-tui-bundle.mjs "$unpacked/package/dist/native"
      - name: Install only diffing
        shell: bash
        run: |
          set -euo pipefail
          root_archive=$(find target/root-tarball -name '*.tgz' -print -quit)
          install_prefix="$RUNNER_TEMP/diffing-global"
          npm install --global --prefix "$install_prefix" "$root_archive"
          native_binary="$install_prefix/lib/node_modules/diffing/dist/native/tui-linux-x64-gnu/diffing-tui"
          "$native_binary" --version
          NO_COLOR=1 "$install_prefix/bin/diffing" doctor \
            | tee "$RUNNER_TEMP/diffing-doctor.txt"
          grep -Eq '/diffing/dist/native/tui-linux-x64-gnu/diffing-tui$' \
            "$RUNNER_TEMP/diffing-doctor.txt"

  publish-root:
    name: Publish diffing
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify-install
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          name: diffing-root
          path: target/root-tarball
      # Publish via npm trusted publishing (OIDC): no long-lived token.
      # Requires a trusted publisher for ahmedragab20/diffing in npm settings.
      - run: npm publish target/root-tarball/*.tgz --access public --provenance

  verify-published:
    name: Verify npm install
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish-root
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install published diffing package
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          for attempt in 1 2 3 4 5; do
            install_prefix="$RUNNER_TEMP/diffing-registry-$attempt"
            native_binary="$install_prefix/lib/node_modules/diffing/dist/native/tui-linux-x64-gnu/diffing-tui"
            if npm install --global --prefer-online \
                --prefix "$install_prefix" "diffing@$version" \
              && "$native_binary" --version \
              && NO_COLOR=1 "$install_prefix/bin/diffing" doctor \
                | tee "$RUNNER_TEMP/diffing-registry-doctor.txt" \
              && grep -Eq \
                '/diffing/dist/native/tui-linux-x64-gnu/diffing-tui$' \
                "$RUNNER_TEMP/diffing-registry-doctor.txt"; then
              exit 0
            fi
            sleep 10
          done
          exit 1

  create-release:
    name: Create GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify-published
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Create release from changelog
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          prev="$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)"
          awk -v v="$version" \
            'BEGIN{f=0} /^## /{if(f) exit; if($2==v) f=1} f' \
            CHANGELOG.md > /tmp/release-notes.md
          test -s /tmp/release-notes.md || {
            echo "changelog section for $version not found" >&2
            exit 1
          }
          if [ -n "$prev" ]; then
            printf '\n**Full Changelog**: ' >> /tmp/release-notes.md
            printf 'https://github.com/%s/compare/%s...%s\n' \
              "$GITHUB_REPOSITORY" "$prev" "$tag" \
              >> /tmp/release-notes.md
          fi
          gh release create "$tag" --title "$tag" \
            --notes-file /tmp/release-notes.md
